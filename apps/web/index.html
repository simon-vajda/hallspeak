<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Hallspeak" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7FAFA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101E2C" />
    <!-- hallspeak:metadata:start -->
    <title>Hallspeak</title>
    <meta name="description" content="Listen to live interpretation in your language." />
    <meta property="og:title" content="Hallspeak" />
    <meta
      property="og:description"
      content="Listen to live interpretation in your language."
    />
    <!-- hallspeak:metadata:end -->
    <!-- Blocking on purpose: the provider writes this class from an effect, which runs
         after first paint, so without this a dark-preference visitor sees a white flash
         on every cold load. The key is duplicated from THEME_STORAGE_KEY in
         src/components/theme-provider.tsx — this runs before any module loads. -->
    <script>
      (() => {
        let dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          const stored = localStorage.getItem("hallspeak-theme");
          if (stored === "dark") {
            dark = true;
          } else if (stored === "light") {
            dark = false;
          }
        } catch {
          // Blocked storage throws here; fall back to the system preference.
        }
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
