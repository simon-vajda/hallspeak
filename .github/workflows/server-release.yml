name: Server release

# The only trigger that builds an image. A pull request runs nothing here, so a change
# to the Dockerfile is reviewed before it can reach the registry. A release never builds:
# release-draft.yml drafts from a successful run of this workflow, and release-publish.yml
# retags the image this run pushed for that commit.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The Dockerfile's `pnpm build` catches a compile error and nothing else, so without
  # this a red main still publishes a pullable image.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      # typecheck runs `pnpm gen` first, so a dirty tree here is generated-file drift:
      # openapi.json or api.d.ts committed out of step with the schemas.
      - run: git diff --exit-code
      - run: pnpm test

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # QEMU is what lets one runner emit both architectures. It is only the small
      # native-dependency stage that runs emulated: the application build is pinned to
      # the build platform, so the slow half never sees QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The short-SHA tag is what a published release promotes to `X.Y.Z`, `X.Y` and
          # `latest`, so every commit needs one. `latest` is never set here, or every push
          # to main would move the tag operators pin against.
          tags: |
            type=edge,branch=main
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The build context excludes .git, so the commit the web footer prints has to be
          # handed in here.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Off so the published tag resolves to a two-entry manifest list. With
          # attestations on, `docker manifest inspect` also lists unknown/unknown
          # entries, which reads as a broken image to an operator checking their pull.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

