name: Server release

# The only triggers that publish an image. A pull request runs nothing here, so a
# change to the Dockerfile is reviewed before it can reach the registry.
on:
  push:
    branches: [main]
    tags: ["server-v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The Dockerfile's `pnpm build` catches a compile error and nothing else, so without
  # this a red main still publishes a pullable image.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: startsWith(github.ref, 'refs/tags/server-v')
        run: node scripts/versioning.mjs release-tag server "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: pnpm typecheck
      # typecheck runs `pnpm gen` first, so a dirty tree here is generated-file drift:
      # openapi.json or api.d.ts committed out of step with the schemas.
      - run: git diff --exit-code
      - run: pnpm test

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: version
        if: startsWith(github.ref, 'refs/tags/server-v')
        run: |
          version="$(node scripts/versioning.mjs release-tag server "$GITHUB_REF_NAME")"
          {
            echo "version=$version"
            echo "minor=${version%.*}"
          } >> "$GITHUB_OUTPUT"

      # QEMU is what lets one runner emit both architectures. It is only the small
      # native-dependency stage that runs emulated: the application build is pinned to
      # the build platform, so the slow half never sees QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # A server-v* tag cuts the stable channel; main cuts the edge channel. The two
          # stable tags are raw rather than semver-patterned: the tag name carries a
          # `server-v` prefix no semver parser accepts, and the version step has already
          # proved it against the manifest. `latest` is enabled explicitly rather than by
          # default branch, or every push to main would move the tag operators pin against.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/server-v') }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ startsWith(github.ref, 'refs/tags/server-v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/server-v') }}
            type=edge,branch=main
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The build context excludes .git, so the commit the web footer prints has to be
          # handed in here.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Off so the published tag resolves to a two-entry manifest list. With
          # attestations on, `docker manifest inspect` also lists unknown/unknown
          # entries, which reads as a broken image to an operator checking their pull.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/server-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not the second row of the sorted list: the tag being released is not always the
          # highest one, and notes would then start from the wrong release.
          previous="$(git tag --list 'server-v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n1)"
          if [ -n "$previous" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest --generate-notes --notes-start-tag "$previous" --title "Server v${{ steps.version.outputs.version }}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest --generate-notes --title "Server v${{ steps.version.outputs.version }}"
          fi
