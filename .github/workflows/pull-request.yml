name: Pull request CI

on:
  pull_request:

# A new commit supersedes work for the previous state of the same pull request.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      # typecheck regenerates the OpenAPI artifacts. Any change, including a new
      # untracked file, means the committed contract no longer matches its schemas.
      - run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - run: pnpm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      # The deps stage selects a mediasoup worker per architecture, so both release
      # platforms are built.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
