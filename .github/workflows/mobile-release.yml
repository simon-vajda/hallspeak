name: Mobile release

on:
  push:
    tags: ['mobile-v*']

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        # Assigned first: inside `echo "$(…)"` the step's exit status is echo's, so a tag
        # the manifest refuses would pass this step and release an empty version.
        run: |
          version="$(node scripts/versioning.mjs release-tag mobile "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm version:check
      - run: pnpm -F @linguacast/mobile typecheck
      - run: pnpm -F @linguacast/mobile test
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not the second row of the sorted list: the tag being released is not always the
          # highest one, and notes would then start from the wrong release.
          previous="$(git tag --list 'mobile-v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n1)"
          if [ -n "$previous" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --generate-notes --notes-start-tag "$previous" --title "LinguaCast Mobile ${{ steps.version.outputs.version }}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --generate-notes --title "LinguaCast Mobile ${{ steps.version.outputs.version }}"
          fi
