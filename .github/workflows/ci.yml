name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      # Drift tripwire (ADR §5.6, layer 3): a client can never be typed
      # against a stale spec, because a stale commit cannot merge.
      - run: pnpm gen && git diff --exit-code

      - run: pnpm build
