# Hallspeak — one container behind a reverse proxy you supply.
#
# Copy .env.example to .env and fill it in; every setting lives there, including the
# version this runs and where your data is kept. This file needs no edits unless you
# change MEDIA_MAX_WORKERS or MEDIA_RTC_PORT_BASE.
# Guide: https://hallspeak.app/getting-started/installation/

services:
  hallspeak:
    image: ghcr.io/simon-vajda/hallspeak:${HALLSPEAK_VERSION:?}
    container_name: hallspeak
    restart: unless-stopped

    env_file: .env
    environment:
      # Repeated so an unfilled .env fails `docker compose up` by name, instead of starting
      # a container that loads every screen and never carries audio.
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:?}

    ports:
      # Plain HTTP for your reverse proxy. Keep it closed to the internet: it is
      # unencrypted and serves the setup wizard. A proxy container on this service's
      # network needs no publication and reaches `hallspeak:3000`.
      - '3000:3000'

      # Audio: MEDIA_MAX_WORKERS ports counting up from MEDIA_RTC_PORT_BASE, on UDP and
      # TCP. Outside and inside numbers must match: to move them, change
      # MEDIA_RTC_PORT_BASE in .env and both ranges here.
      - '44400-44403:44400-44403/udp'
      - '44400-44403:44400-44403/tcp'

    volumes:
      - ${HALLSPEAK_DATA_DIR:-./data}:/data
