# LinguaCast — one container behind a reverse proxy you supply.
#
# Copy .env.example to .env and fill it in; every setting lives there, including the
# version this runs. HTTPS is not optional: microphone capture and the admin session
# cookie both require it. Full walkthrough: docs/hosting.md.

services:
  linguacast:
    image: ghcr.io/simon-vajda/linguacast:${LINGUACAST_VERSION:?copy .env.example to .env first}
    restart: unless-stopped

    env_file: .env
    environment:
      # Declared again so an unfilled .env fails `docker compose up` by name, before a
      # container exists that could only ever load and stay silent.
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:?set this to your public hostname, e.g. linguacast.example.com}

    ports:
      # HTTP: the SPA, the API and the Socket.IO endpoint, in cleartext. Bound to
      # loopback because a published port bypasses the host firewall, and anyone who
      # reaches this before you do can claim the admin account through the setup wizard.
      # Widen it to '3000:3000' only if your proxy runs on another host — and put a
      # firewall in front of it if you do. A proxy in a container needs no publication
      # at all: put it on this service's network and reach it as `linguacast:3000`.
      - '127.0.0.1:3000:3000'

      # RTC: worker i binds MEDIA_RTC_PORT_BASE + i on UDP and TCP alike. The external and
      # internal numbers must match — a remapped port leaves signalling working and audio
      # silently absent, because the port inside the ICE candidate is the one the worker
      # bound. Forward these on your router too, and extend the range by hand if you raise
      # MEDIA_MAX_WORKERS: Compose cannot derive a range from a variable.
      - '44400-44403:44400-44403/udp'
      - '44400-44403:44400-44403/tcp'

    volumes:
      # The SQLite database and admin.json — the whole of your data. Back this up, and it
      # is what makes a container recreate survivable.
      - ./data:/data
