packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
# esbuild is tsx's bundler; its install script links the platform binary.
# better-sqlite3 has no install script, but its binding.gyp makes pnpm infer an
# implicit `node-gyp rebuild`. Declining it is correct, not a compromise: the npm
# tarball ships prebuilt N-API binaries for all eight platform/libc targets, and
# N-API keeps one binary ABI-stable across Node 22/24/26. Listing it as false is
# what makes `pnpm install` exit 0.
# mediasoup is `true` for the opposite reason to the `false` directly above it, and the
# two entries look interchangeable. Its postinstall *downloads* the prebuilt worker
# binary rather than compiling one, so blocking it yields no worker at all — a boot
# failure — instead of a slower local build.
allowBuilds:
  esbuild: true
  better-sqlite3: false
  mediasoup: true
  # jest-expo pulls both of these as optional native accelerators. @parcel/watcher
  # is jest-haste-map's file watcher, which falls back to Node's own fs watching;
  # unrs-resolver ships prebuilt N-API binaries as optionalDependencies and only
  # compiles when none matches. Declining both keeps `pnpm install` exit 0 with no
  # loss of behaviour.
  '@parcel/watcher': false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.25'
  - '@tanstack/router-core@1.171.21'
  - '@tanstack/router-generator@1.167.27'
  - '@tanstack/router-plugin@1.168.29'
  - babel-preset-expo@57.0.11
  - esbuild@0.24.3
  - uuid@11.1.1
  - js-yaml@4.3.1
  - decode-uri-component@0.4.3
  - qs@6.15.4
  - qs@6.16.0
  - fast-uri@3.1.6
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11'
  - js-yaml@4.3.2
  - hono@4.13.5
